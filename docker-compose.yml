# ============================================================
# Digital Saathi — Docker Compose
# Full-stack orchestration: PostgreSQL + Backend + Frontend
# ============================================================
version: "3.9"

services:

  # ── PostgreSQL Database ───────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: digital_saathi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digital_saathi}
      POSTGRES_USER: ${POSTGRES_USER:-saathi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saathipassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saathi} -d ${POSTGRES_DB:-digital_saathi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saathi_net
    ports:
      - "${POSTGRES_PORT:-5432}:5432"   # expose only for local debugging

  # ── FastAPI Backend ───────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: digital_saathi_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # App
      APP_NAME: "Digital Saathi"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY}
      # Database — override for PostgreSQL in production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-saathi}:${POSTGRES_PASSWORD:-saathipassword}@db:5432/${POSTGRES_DB:-digital_saathi}
      # LLM Provider
      LLM_PROVIDER: ${LLM_PROVIDER:-demo}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # CORS
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:80,http://localhost:3000}
      # File Uploads
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - saathi_net
    ports:
      - "${BACKEND_PORT:-8000}:8000"   # expose for direct API access / Swagger

  # ── React Frontend (nginx) ───────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: digital_saathi_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - saathi_net
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health.txt || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

# ── Named Volumes ─────────────────────────────────────────
volumes:
  postgres_data:
    name: digital_saathi_postgres_data
  backend_uploads:
    name: digital_saathi_uploads

# ── Networks ──────────────────────────────────────────────
networks:
  saathi_net:
    name: digital_saathi_network
    driver: bridge
